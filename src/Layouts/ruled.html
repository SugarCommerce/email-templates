<!doctype html>
<html lang="{{lang}}"{{dir}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:{{card}};">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{card}};padding:40px 20px;">
<tr><td align="center">
<table role="presentation" width="{{width}}" cellpadding="0" cellspacing="0" border="0" style="max-width:{{width}}px;width:100%;font-family:{{font}};">
<tr><td style="padding-bottom:16px;border-bottom:2px solid {{text}};">
<span style="font-size:{{font_size}}px;font-weight:700;color:{{text}};letter-spacing:0.04em;text-transform:uppercase;">{{business_name}}</span>
</td></tr>
<tr><td style="padding:28px 0;color:{{text}};font-size:{{font_size}}px;line-height:{{line_height}};">{{content}}</td></tr>
<tr><td style="padding-top:20px;border-top:1px solid {{border}};color:{{muted}};font-size:{{small_size}}px;line-height:1.6;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
