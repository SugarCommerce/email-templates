<!doctype html>
<html lang="{{lang}}"{{dir}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:{{background}};">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{background}};padding:40px 16px;">
<tr><td align="center">
<table role="presentation" width="{{width}}" cellpadding="0" cellspacing="0" border="0" style="max-width:{{width}}px;width:100%;background:{{card}};border:1px solid {{border}};border-radius:{{radius}}px;font-family:{{font}};">
<tr><td style="padding:{{padding}}px {{padding}}px 0;">
<span style="font-size:{{font_size}}px;font-weight:600;color:{{text}};letter-spacing:-0.01em;">{{business_name}}</span>
</td></tr>
<tr><td style="padding:20px {{padding}}px {{padding}}px;color:{{text}};font-size:{{font_size}}px;line-height:{{line_height}};">{{content}}</td></tr>
<tr><td style="padding:20px {{padding}}px;border-top:1px solid {{border}};color:{{muted}};font-size:{{small_size}}px;line-height:1.6;">{{footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
